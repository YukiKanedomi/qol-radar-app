<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#ece8de"/>
    </radialGradient>
    <radialGradient id="sweep" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f3d3a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1f3d3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d75f38" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#b6452f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#b6452f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- sweep sector -->
  <path d="M256 256 L256 92 A164 164 0 0 1 397 174 Z" fill="url(#sweep)"/>

  <!-- concentric radar rings (松葉) -->
  <g fill="none" stroke="#1f3d3a" stroke-linecap="round">
    <circle cx="256" cy="256" r="62" stroke-opacity="0.26" stroke-width="5"/>
    <circle cx="256" cy="256" r="120" stroke-opacity="0.18" stroke-width="4.5"/>
    <circle cx="256" cy="256" r="178" stroke-opacity="0.12" stroke-width="4"/>
  </g>

  <!-- radar arm to the blip -->
  <line x1="256" y1="256" x2="362" y2="181" stroke="#1f3d3a" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>

  <!-- center hub -->
  <circle cx="256" cy="256" r="9" fill="#1f3d3a"/>

  <!-- the "good signal" blip (朱) -->
  <circle cx="362" cy="181" r="54" fill="url(#glow)"/>
  <circle cx="362" cy="181" r="18" fill="#ffffff"/>
  <circle cx="362" cy="181" r="11.5" fill="#b6452f"/>
</svg>
