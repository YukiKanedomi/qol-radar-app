<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A. 落款「良」: 生成りの紙に朱印。エディトリアルの署名 -->
  <rect width="512" height="512" fill="#f5f1e8"/>
  <!-- 紙の淡い枠（雑誌の罫） -->
  <rect x="34" y="34" width="444" height="444" fill="none" stroke="#1f3d3a" stroke-opacity="0.28" stroke-width="4"/>
  <rect x="48" y="48" width="416" height="416" fill="none" stroke="#1f3d3a" stroke-opacity="0.14" stroke-width="2"/>
  <!-- 朱印 -->
  <rect x="116" y="116" width="280" height="280" rx="26" fill="#b6452f"/>
  <rect x="116" y="116" width="280" height="280" rx="26" fill="none" stroke="#8f3323" stroke-width="6" stroke-opacity="0.5"/>
  <text x="256" y="272" text-anchor="middle" dominant-baseline="middle"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif" font-weight="700"
        font-size="200" fill="#f5f1e8">良</text>
</svg>
